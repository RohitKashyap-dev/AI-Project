[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatter_generic]
class = generic
format = %(levelname)-5.5s [%(name)s] %(message)s

def main():
    pass

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[format]
keys = generic
