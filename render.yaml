services:
  - type: web
    name: scam-detector-api
    env: python
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        value: postgresql://user:password@host/dbname?sslmode=require
      - key: POSTGRES_HOST
        value: localhost
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: scamdetector
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: GOOGLE_API_KEY
        value: your-google-api-key
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: password
      - key: VECTOR_BACKEND
        value: pgvector
