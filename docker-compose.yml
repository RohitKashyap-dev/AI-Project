version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scam_detector_db
    environment:
      POSTGRES_DB: scamdetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scamdetector"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scam_detector_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scam_detector_api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: scamdetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python3 - <<'PY'
      import asyncio
      from backend.core.migration_runner import create_all_tables
      from backend.bootstrap import bootstrap_application
      asyncio.run(create_all_tables())
      print(asyncio.run(bootstrap_application()))
      PY
      uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scam_detector_worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: scamdetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python3 - <<'PY'
      import asyncio
      from backend.core.migration_runner import create_all_tables
      asyncio.run(create_all_tables())
      PY
      celery -A backend.core.celery_app worker --loglevel=info"

  prometheus:
    image: prom/prometheus:latest
    container_name: scam_detector_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  postgres_data:
